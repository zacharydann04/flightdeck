<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - FlightDeck</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">FlightDeck</a>
            <div class="nav-links" id="navLinks">
                <a href="#" id="profileLink" class="btn-link">My Profile</a>
                <a href="#" id="logoutBtn" class="btn-link">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="edit-profile-container">
            <h2>Edit Profile</h2>
            
            <div class="profile-picture-section">
                <img id="currentProfilePicture" src="/css/default-avatar.svg" alt="Profile Picture" class="profile-picture-large">
                <form id="pictureForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="profilePicture" class="file-label">Change Profile Picture</label>
                        <input type="file" id="profilePicture" name="profilePicture" accept="image/*">
                    </div>
                    <button type="submit" class="btn-secondary">Upload Picture</button>
                </form>
            </div>

            <form id="editProfileForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName">
                </div>
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio" rows="4"></textarea>
                </div>
                <div id="error" class="error-message"></div>
                <div id="success" class="success-message"></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <a href="#" id="cancelBtn" class="btn-link">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/edit-profile.js"></script>
</body>
</html>
